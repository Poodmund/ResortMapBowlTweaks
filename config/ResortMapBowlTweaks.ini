; Ski-E-O ResortMapBowlTweaks v1.0.0
; Place this file at mods/ResortMapBowlTweaks/ResortMapBowlTweaks.ini.
; Changes take effect after restarting the game.

[ResortMap]

; Enable diagnostic logging to logs/ResortMapBowlTweaks.log.
debug = false

; Identify bowl labels from native map source records (recommended).
; false selects exact bowl-name matching instead.
id_label_style = true

; Bowl centreline appearance: dashed | solid | hidden
lines = dashed

; Dash and gap lengths, in map-local Slate units (only for dashed lines).
; Accepted ranges: dash_length 3-30; gap_length 4-60.
dash_length = 7
gap_length = 15

; Bowl label appearance:
; default  = dark text with light outline
; inverted = light text with dark outline
; box      = dark text on a light rectangular plate with dark border
trail_name_text = default

; Hex sRGB colours used by the selected text style (#RRGGBB).
light_color = #EFE7D4
dark_color = #26262B
