Name = Resort Map Bowl Tweaks
Description = Replaces bowl outlines in the Resort Map with downhill centrelines (or hidden completely) and provides configurable bowl line and label styles.
Usage = Open Settings > Interface and adjust the four Resort Map Bowl options beneath Trail Rating Style. Press Apply to save changes, then reopen Resort Map to see them. The mod generates ResortMapBowlTweaks.ini automatically and preserves existing settings.